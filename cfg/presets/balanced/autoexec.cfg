// ===================================================================
// deadlockoptimization :: BALANCED preset :: autoexec.cfg
// Target: Ryzen 7 5700X + Radeon RX 9070 XT
//
// Runs every time the game starts (needs "+exec autoexec.cfg" in your
// Steam launch options, install.ps1 prints the full line). Everything in
// here is a user-facing preference. The engine-level performance convars
// live in gameinfo.gi (see cfg/presets/balanced/gameinfo_convars.txt).
// ===================================================================
echo "[deadlockoptimization] loading autoexec (balanced)"

// --- Frame cap -----------------------------------------------------
// 0 = uncapped. On a 5700X you will be CPU-bound in team fights no matter
// what, so an uncapped limit gives the highest average fps. If you would
// rather have flatter frametimes, cap at a value your CPU holds in fights
// (try 200 or 240) and compare the 1% lows with cl_showfps 2.
fps_max                                 "0"
fps_max_ui                              "120"     // menus and loading screens
fps_max_tools                           "60"

// --- Latency -------------------------------------------------------
r_low_latency                           "1"       // AMD Anti-Lag 2 via the engine (0 off, 1 on)
engine_low_latency_sleep_after_client_tick "false" // leave off, people report pacing issues with it on

// --- Input ---------------------------------------------------------
cl_input_enable_raw_keyboard            "1"

// --- CPU-side cleanups that are also archived (persist across runs) -
cl_ragdoll_limit                        "0"
r_drawtracers_firstperson               "true"    // keep your own tracers, they're cheap

// --- Network (defaults are already correct, pinned here on purpose) --
cl_updaterate                           "128"
rate                                    "786432"

// --- Optional visibility / comfort tweaks (uncomment to enable) ----
// citadel_reduce_camera_shake          "true"
// citadel_camera_wobble_disable        "true"
// citadel_trooper_glow_disabled        "1"       // no glow on minions
// citadel_boss_glow_disabled           "1"
// citadel_damage_text_lifetime         "0.8"     // default 1.5

// --- Your own stuff ------------------------------------------------
// install.ps1 renames a pre-existing autoexec.cfg to autoexec_user.cfg and
// executes it from here so nothing you had is lost.
exec autoexec_user.cfg

echo "[deadlockoptimization] autoexec done"
