// ===================================================================
// deadlockoptimization :: MAXFPS preset :: autoexec.cfg
// Target: Ryzen 7 5700X + Radeon RX 9070 XT
//
// Runs every time the game starts (needs "+exec autoexec.cfg" in your
// Steam launch options). User-facing preferences only. Engine-level
// performance convars live in gameinfo.gi.
// ===================================================================
echo "[deadlockoptimization] loading autoexec (maxfps)"

// --- Frame cap -----------------------------------------------------
fps_max                                 "0"
fps_max_ui                              "60"
fps_max_tools                           "60"

// --- Latency -------------------------------------------------------
r_low_latency                           "1"
engine_low_latency_sleep_after_client_tick "false"

// --- Input ---------------------------------------------------------
cl_input_enable_raw_keyboard            "1"

// --- CPU-side cleanups ---------------------------------------------
cl_ragdoll_limit                        "0"
r_drawtracers_firstperson               "false"

// --- Visibility: glow off, shake off --------------------------------
citadel_reduce_camera_shake             "true"
citadel_camera_wobble_disable           "true"
citadel_trooper_glow_disabled           "1"
citadel_trooper_friendly_glow_disabled  "1"
citadel_boss_glow_disabled              "1"
cl_glow_brightness                      "0"

// --- Network -------------------------------------------------------
cl_updaterate                           "128"
rate                                    "786432"

// --- Your own stuff ------------------------------------------------
exec autoexec_user.cfg

echo "[deadlockoptimization] autoexec done"
